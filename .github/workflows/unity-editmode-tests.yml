name: Unity EditMode 테스트

on:
  # 참고: workflow_dispatch는 워크플로 파일이 기본 브랜치에 있어야 수동 실행 이벤트를 받는다.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_dispatch
  workflow_dispatch:

jobs:
  editmode-tests:
    name: EditMode 테스트 실행
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: LFS 오브젝트 가져오기
        # public repo에 사설 LFS 서버 URL을 노출하지 않기 위해 LFS_URL repository variable을 사용한다.
        # actions/checkout의 lfs:true 대신 체크아웃 이후 명시적으로 LFS URL과 인증을 주입한 뒤 pull한다.
        # https://docs.github.com/billing/managing-billing-for-git-large-file-storage/about-billing-for-git-large-file-storage
        env:
          LFS_ACCOUNT_ID: ${{ secrets.LFS_ACCOUNT_ID }}
          LFS_ACCOUNT_PASSWORD: ${{ secrets.LFS_ACCOUNT_PASSWORD }}
          LFS_URL: ${{ vars.LFS_URL }}
        run: |
          if [ -z "${LFS_URL:-}" ]; then
            echo "::error::사설 LFS 서버 URL 주입을 위해 LFS_URL repository variable이 필요합니다."
            exit 1
          fi

          if [ -z "${LFS_ACCOUNT_ID:-}" ] || [ -z "${LFS_ACCOUNT_PASSWORD:-}" ]; then
            echo "::error::커스텀 LFS 서버 인증을 위해 LFS_ACCOUNT_ID, LFS_ACCOUNT_PASSWORD repository secret이 필요합니다."
            exit 1
          fi

          lfs_host="${LFS_URL#https://}"
          lfs_host="${lfs_host%%/*}"
          if [ -z "$lfs_host" ] || [ "$lfs_host" = "$LFS_URL" ]; then
            echo "::error::LFS_URL에서 host를 추출하지 못했습니다."
            exit 1
          fi

          git config --local remote.origin.lfsurl "$LFS_URL"
          git config --global credential.helper store
          printf "protocol=https\nhost=%s\nusername=%s\npassword=%s\n\n" "$lfs_host" "$LFS_ACCOUNT_ID" "$LFS_ACCOUNT_PASSWORD" | git credential approve
          git lfs install --local
          git lfs pull

      - name: Unity Library 캐시 복원
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Unity-6000.3.13f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-Unity-6000.3.13f1-

      - name: EditMode 테스트 실행
        id: unity-tests
        # 참고: GameCI Test Runner는 Unity 라이선스 시크릿과 testMode/artifactsPath 입력을 지원한다.
        # https://game.ci/docs/github/test-runner/
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.13f1
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # 테스트 결과는 실패 시 원인 확인에 필요하지만, 보관 기간이 길어지면 저장소 비용/한도에 영향을 줄 수 있다.
      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
