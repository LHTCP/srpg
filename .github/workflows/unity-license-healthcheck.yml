name: Unity 라이선스 헬스체크

on:
  # Unity Editor를 실행하기 전, Actions secret 구성이 명백히 잘못된 상태인지 먼저 확인한다.
  # 실제 Unity 활성화 성공 여부는 Windows/WebGL 빌드 workflow에서 최종 검증한다.
  workflow_dispatch:
  workflow_call:
    outputs:
      email_configured:
        description: "UNITY_EMAIL secret이 설정되어 있는지 여부"
        value: ${{ jobs.unity-license-healthcheck.outputs.email_configured }}
      license_bytes:
        description: "UNITY_LICENSE secret을 파일로 저장했을 때의 byte 수"
        value: ${{ jobs.unity-license-healthcheck.outputs.license_bytes }}
      license_shape:
        description: "UNITY_LICENSE secret의 기본 형식 점검 결과"
        value: ${{ jobs.unity-license-healthcheck.outputs.license_shape }}

permissions:
  contents: read

concurrency:
  group: unity-license-healthcheck
  cancel-in-progress: false

jobs:
  unity-license-healthcheck:
    name: Unity 라이선스 secret 점검
    runs-on: ubuntu-latest
    outputs:
      email_configured: ${{ steps.secret-presence.outputs.email_configured }}
      license_bytes: ${{ steps.license-shape.outputs.license_bytes }}
      license_shape: ${{ steps.license-shape.outputs.license_shape }}
    steps:
      - name: Unity secret 존재 확인
        id: secret-presence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${UNITY_LICENSE:-}" ]; then
            echo "::error::UNITY_LICENSE repository secret이 필요합니다."
            missing=1
          fi

          if [ -z "${UNITY_EMAIL:-}" ]; then
            echo "::error::UNITY_EMAIL repository secret이 필요합니다."
            missing=1
          fi

          if [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::UNITY_PASSWORD repository secret이 필요합니다."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [[ "$UNITY_EMAIL" != *@* ]]; then
            echo "::error::UNITY_EMAIL secret이 이메일 형식으로 보이지 않습니다."
            exit 1
          fi

          echo "email_configured=true" >> "$GITHUB_OUTPUT"
          echo "Unity 계정 secret 3종이 설정되어 있습니다."

      - name: UNITY_LICENSE 형식 점검
        id: license-shape
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          set -euo pipefail

          # secret 값을 로그에 직접 쓰지 않기 위해 runner 임시 파일로만 저장하고,
          # byte 수와 대표 marker만 확인한다.
          license_file="$RUNNER_TEMP/Unity_lic.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"

          license_bytes="$(wc -c < "$license_file" | tr -d ' ')"
          echo "license_bytes=${license_bytes}" >> "$GITHUB_OUTPUT"

          if [ "$license_bytes" -lt 100 ]; then
            echo "license_shape=too_small" >> "$GITHUB_OUTPUT"
            echo "::error::UNITY_LICENSE secret이 Unity license 파일이라고 보기에는 너무 작습니다."
            exit 1
          fi

          if ! grep -Eiq 'Unity|License|<\?xml' "$license_file"; then
            echo "license_shape=unknown" >> "$GITHUB_OUTPUT"
            echo "::error::UNITY_LICENSE secret에서 Unity license 파일 marker를 찾지 못했습니다."
            exit 1
          fi

          echo "license_shape=plausible" >> "$GITHUB_OUTPUT"

      - name: 헬스체크 요약
        env:
          LICENSE_BYTES: ${{ steps.license-shape.outputs.license_bytes }}
          LICENSE_SHAPE: ${{ steps.license-shape.outputs.license_shape }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Unity 라이선스 헬스체크

          - UNITY_EMAIL: configured
          - UNITY_PASSWORD: configured
          - UNITY_LICENSE byte size: ${LICENSE_BYTES}
          - UNITY_LICENSE shape: ${LICENSE_SHAPE}

          이 workflow는 secret 존재와 라이선스 파일의 기본 형태만 확인합니다.
          실제 Unity Editor 활성화 성공 여부는 Unity build/test workflow에서 최종 확인합니다.
          SUMMARY
