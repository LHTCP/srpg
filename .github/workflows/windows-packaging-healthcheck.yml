name: Windows 패키징 헬스체크

on:
  # Unity 빌드 없이 zip 패키징과 artifact 업로드 경로만 빠르게 검증한다.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-demo-build.yml"
      - ".github/workflows/windows-packaging-healthcheck.yml"
      - "scripts/package-windows-demo.sh"

permissions:
  contents: read

concurrency:
  group: windows-packaging-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-healthcheck:
    name: Windows 패키징과 artifact 업로드 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Unity Library 캐시 조회
        # 실제 Unity 빌드는 하지 않지만, cache key와 restore 경로가 깨지지 않았는지 빠르게 확인한다.
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Unity-6000.3.13f1-StandaloneWindows64-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-Unity-6000.3.13f1-StandaloneWindows64-
          lookup-only: true

      - name: 모의 Windows 빌드 산출물 생성
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/StandaloneWindows64/WindowsDemo_Data
          printf 'fake executable for packaging healthcheck\n' > build/StandaloneWindows64/WindowsDemo.exe
          printf 'fake unity player dll\n' > build/StandaloneWindows64/UnityPlayer.dll
          printf 'fake boot config\n' > build/StandaloneWindows64/WindowsDemo_Data/boot.config

      - name: Windows zip 패키징
        env:
          BUILD_DIR: build/StandaloneWindows64
          ARTIFACT_NAME: srpg-demo-windows-packaging-healthcheck
          BASE_VERSION: 0.0.0
          FULL_VERSION: 0.0.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          CHANNEL: healthcheck
          COMMIT_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: bash scripts/package-windows-demo.sh

      - name: Windows zip artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: srpg-demo-windows-packaging-healthcheck
          path: dist/srpg-demo-windows-packaging-healthcheck.zip
          if-no-files-found: error
          retention-days: 1
