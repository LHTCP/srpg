name: Windows Release asset 업로드

on:
  # 검증된 Windows artifact를 사람이 고른 뒤 GitHub Release asset으로 올리는 수동 workflow다.
  # tag push 자동 릴리스는 수동 우선 결정(#43)에 따라 여기에서 켜지 않는다.
  workflow_dispatch:
    inputs:
      run_id:
        description: "성공한 Windows PC 데모 빌드 workflow run id"
        required: true
      artifact_name:
        description: "Release asset으로 올릴 GitHub Actions artifact 이름"
        required: true
      tag:
        description: "릴리스 태그(v<a.b.c>). ProjectSettings bundleVersion과 일치해야 한다"
        required: true
      prerelease:
        description: "새 Release를 prerelease로 만든다"
        type: boolean
        required: false
        default: true
      overwrite:
        description: "이미 있는 Release의 같은 이름 asset을 덮어쓴다"
        type: boolean
        required: false
        default: false

permissions:
  # Release와 tag 생성에는 contents: write가 필요하다.
  contents: write
  actions: read

concurrency:
  group: windows-release-asset
  cancel-in-progress: false

jobs:
  upload-release-asset:
    name: Windows zip을 GitHub Release asset으로 업로드
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 입력값과 버전 확인
        id: inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id는 숫자여야 합니다."
            exit 1
          fi

          if ! [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::artifact_name에는 영문, 숫자, '.', '_', '-'만 사용할 수 있습니다."
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag는 v<a.b.c> 형식이어야 합니다. 예: v0.1.0"
            exit 1
          fi

          base_version="$(grep -m1 '^[[:space:]]*bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')"
          if [ -z "${base_version:-}" ]; then
            echo "::error::ProjectSettings.asset에서 bundleVersion을 찾지 못했습니다."
            exit 1
          fi

          tag_version="${TAG#v}"
          if [ "$tag_version" != "$base_version" ]; then
            echo "::error::tag 버전(${tag_version})이 ProjectSettings bundleVersion(${base_version})과 다릅니다."
            exit 1
          fi

          # Windows artifact 이름은 srpg-demo-windows-<a.b.c.build>-<short-sha> 형식이다.
          # 다른 버전에서 만든 빌드를 이 태그로 올리는 실수를 막는다.
          case "$ARTIFACT_NAME" in
            "srpg-demo-windows-${tag_version}."*) ;;
            *)
              echo "::error::artifact 이름이 srpg-demo-windows-${tag_version}.<build>-<short-sha> 형식이 아닙니다."
              exit 1
              ;;
          esac

          echo "tag_version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: 원본 Windows 빌드 run 확인
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/windows-demo-build.yml
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          workflow_path="$(jq -r '.path // ""' <<< "$run_json")"
          status="$(jq -r '.status // ""' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
          head_sha="$(jq -r '.head_sha // ""' <<< "$run_json")"
          run_url="$(jq -r '.html_url // ""' <<< "$run_json")"

          # workflow 파일 경로 뒤에 @ref가 붙어 올 수 있으므로 떼고 비교한다.
          if [ "${workflow_path%%@*}" != "$EXPECTED_WORKFLOW_PATH" ]; then
            echo "::error::run ${RUN_ID}는 Windows PC 데모 빌드 workflow의 run이 아닙니다. (path: ${workflow_path})"
            exit 1
          fi

          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::run ${RUN_ID}가 성공으로 끝나지 않았습니다. (status: ${status}, conclusion: ${conclusion})"
            exit 1
          fi

          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::run ${RUN_ID}의 head sha를 확인하지 못했습니다."
            exit 1
          fi

          {
            echo "head_sha=${head_sha}"
            echo "run_url=${run_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Windows artifact 다운로드
        # actions/download-artifact는 다른 workflow run의 artifact도 run-id와 token으로 받을 수 있다.
        # 여기서는 바깥 GitHub artifact 컨테이너가 아니라 upload-artifact에 담긴 실제 zip 파일을 꺼낸다.
        # artifact 보관 기간(7일)이 지났으면 이 단계가 실패하므로 Windows 빌드부터 다시 만든다.
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release-asset

      - name: 업로드 대상 zip 확인
        id: package
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail

          expected_zip="dist/release-asset/${ARTIFACT_NAME}.zip"
          if [ -f "$expected_zip" ]; then
            zip_path="$expected_zip"
          else
            mapfile -t zip_files < <(find dist/release-asset -type f -name '*.zip' | sort)
            if [ "${#zip_files[@]}" -ne 1 ]; then
              echo "::error::업로드할 zip 파일을 하나로 특정하지 못했습니다. artifact 이름과 내용을 확인하세요."
              printf 'found: %s\n' "${zip_files[@]:-<none>}"
              exit 1
            fi
            zip_path="${zip_files[0]}"
          fi

          {
            echo "zip_path=${zip_path}"
            echo "zip_name=$(basename "$zip_path")"
          } >> "$GITHUB_OUTPUT"

      - name: Release 생성 또는 asset 업로드
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          OVERWRITE: ${{ inputs.overwrite }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          RUN_URL: ${{ steps.source.outputs.run_url }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          # 태그가 이미 있으면 원본 빌드 커밋을 가리키는지 확인한다.
          # annotated tag는 peel된 줄(^{})이 뒤에 오므로 마지막 줄의 sha를 쓴다.
          tag_sha="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | awk '{print $1}')"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$HEAD_SHA" ]; then
            echo "::error::태그 ${TAG}가 이미 다른 커밋(${tag_sha})을 가리킵니다. 원본 빌드 커밋은 ${HEAD_SHA}입니다."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "::error::Release ${TAG}가 이미 있습니다. 같은 태그에 다시 올리려면 overwrite=true로 실행하거나 버전을 올리세요."
              exit 1
            fi

            # 기존 Release의 제목, 본문, prerelease 여부는 건드리지 않고 asset만 올린다.
            gh release upload "$TAG" "$ZIP_PATH" --clobber --repo "$GITHUB_REPOSITORY"
            action="기존 Release에 asset 업로드(overwrite)"
          else
            notes_file="$(mktemp)"
            {
              echo "Windows PC 데모 빌드 zip입니다."
              echo ""
              echo "- source run: ${RUN_URL} (run id ${RUN_ID})"
              echo "- commit: ${HEAD_SHA}"
              echo "- artifact: ${ARTIFACT_NAME}"
              echo "- asset: ${ZIP_NAME}"
            } > "$notes_file"

            create_args=("$TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$TAG" --notes-file "$notes_file")
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi

            gh release create "${create_args[@]}"
            action="새 Release 생성"
          fi

          release_url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"

          {
            echo "release_url=${release_url}"
            echo "action=${action}"
          } >> "$GITHUB_OUTPUT"

      - name: 업로드 요약
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          RUN_URL: ${{ steps.source.outputs.run_url }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          ACTION: ${{ steps.release.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Windows Release asset 업로드"
            echo ""
            echo "- release: <${RELEASE_URL}>"
            echo "- tag: \`${TAG}\`"
            echo "- 처리: ${ACTION}"
            echo "- source run: \`${RUN_ID}\` <${RUN_URL}>"
            echo "- artifact: \`${ARTIFACT_NAME}\`"
            echo "- asset: \`${ZIP_NAME}\`"
            echo "- sha: \`${HEAD_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
