name: itch.io Development 업로드

on:
  # 검증된 Windows artifact를 사람이 고른 뒤 development 채널에 올리는 수동 workflow다.
  # main merge 자동 업로드는 아직 운영 결정 전이므로 여기에서 켜지 않는다.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Windows PC 데모 빌드 workflow run id"
        required: true
      artifact_name:
        description: "업로드할 GitHub Actions artifact 이름"
        required: true
      version:
        description: "선택: itch.io에 표시할 전체 버전(a.b.c.build). 비우면 artifact 이름에서 추출"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: itchio-development-upload
  cancel-in-progress: false

jobs:
  upload-development:
    name: Windows zip을 itch.io development에 업로드
    runs-on: ubuntu-latest
    steps:
      - name: 업로드 설정 확인
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::error::BUTLER_API_KEY repository secret이 필요합니다."
            missing=1
          fi

          if [ -z "${ITCHIO_USERNAME:-}" ]; then
            echo "::error::ITCHIO_USERNAME repository variable이 필요합니다."
            missing=1
          fi

          if [ -z "${ITCHIO_GAME:-}" ]; then
            echo "::error::ITCHIO_GAME repository variable이 필요합니다."
            missing=1
          fi

          exit "$missing"

      - name: Windows artifact 다운로드
        # actions/download-artifact는 다른 workflow run의 artifact도 run-id와 token으로 받을 수 있다.
        # 여기서는 바깥 GitHub artifact 컨테이너가 아니라 upload-artifact에 담긴 실제 zip 파일을 꺼낸다.
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/itchio-upload

      - name: 업로드 대상 zip과 버전 계산
        id: package
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          expected_zip="dist/itchio-upload/${ARTIFACT_NAME}.zip"
          if [ -f "$expected_zip" ]; then
            zip_path="$expected_zip"
          else
            mapfile -t zip_files < <(find dist/itchio-upload -type f -name '*.zip' | sort)
            if [ "${#zip_files[@]}" -ne 1 ]; then
              echo "::error::업로드할 zip 파일을 하나로 특정하지 못했습니다. artifact 이름과 내용을 확인하세요."
              printf 'found: %s\n' "${zip_files[@]:-<none>}"
              exit 1
            fi
            zip_path="${zip_files[0]}"
          fi

          if [ -n "${INPUT_VERSION:-}" ]; then
            full_version="$INPUT_VERSION"
          else
            # Windows artifact 이름은 srpg-demo-windows-<a.b.c.build>-<short-sha> 형식이다.
            # 수동 입력 실수를 줄이기 위해 기본 버전은 artifact 이름에서 추출한다.
            version_part="${ARTIFACT_NAME#srpg-demo-windows-}"
            full_version="${version_part%-*}"
            if [ "$version_part" = "$ARTIFACT_NAME" ] || [ -z "$full_version" ] || [ "$full_version" = "$version_part" ]; then
              echo "::error::artifact 이름에서 버전을 추출하지 못했습니다. version 입력값을 직접 지정하세요."
              exit 1
            fi
          fi

          {
            echo "zip_path=${zip_path}"
            echo "full_version=${full_version}"
          } >> "$GITHUB_OUTPUT"

      - name: butler 설치
        # itch.io가 안내하는 BUTLER_API_KEY 환경변수를 그대로 쓰기 위해 setup-butler 액션을 사용한다.
        uses: remarkablegames/setup-butler@v3

      - name: itch.io development 업로드
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          FULL_VERSION: ${{ steps.package.outputs.full_version }}
        shell: bash
        run: |
          set -euo pipefail

          butler push "$ZIP_PATH" "${ITCHIO_USERNAME}/${ITCHIO_GAME}:development" --userversion "$FULL_VERSION"

      - name: 업로드 요약
        env:
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          RUN_ID: ${{ inputs.run_id }}
          FULL_VERSION: ${{ steps.package.outputs.full_version }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## itch.io development 업로드"
            echo ""
            echo "- target: \`${ITCHIO_USERNAME}/${ITCHIO_GAME}:development\`"
            echo "- source run: \`${RUN_ID}\`"
            echo "- artifact: \`${ARTIFACT_NAME}\`"
            echo "- userversion: \`${FULL_VERSION}\`"
            echo "- project: <https://${ITCHIO_USERNAME}.itch.io/${ITCHIO_GAME}>"
          } >> "$GITHUB_STEP_SUMMARY"
