name: PR 빠른 체크

on:
  pull_request:
  workflow_dispatch:

jobs:
  repo-sanity:
    name: 저장소 구조 및 문서 검증
    # public 저장소의 standard GitHub-hosted runner는 무료지만, larger runner,
    # artifact/cache/storage 사용은 과금 또는 플랜 한도 영향을 받을 수 있다.
    # runner 종류나 산출물 업로드를 바꿀 때는 비용 리스크를 함께 리뷰한다.
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 검증 스크립트 실행
        run: bash ./scripts/validate-repo.sh

  logic-tests:
    name: 전투 로직 테스트 (.NET)
    # Unity 없이 순수 전투 로직과 EditMode 테스트를 .NET SDK로 컴파일·실행한다.
    # Unity 라이선스나 LFS가 필요 없고 standard runner에서 돈다. 캐시와 아티팩트는 쓰지 않는다.
    # 컨트롤러·HUD·메이커 화면 코드는 대상이 아니다(docs/project/logic-tests.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: .NET SDK 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 로직 테스트 실행
        run: bash ./scripts/run-logic-tests.sh
