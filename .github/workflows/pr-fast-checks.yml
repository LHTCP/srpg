name: PR 빠른 체크

on:
  pull_request:
  workflow_dispatch:

jobs:
  repo-sanity:
    name: 저장소 구조 및 문서 검증
    # public 저장소의 standard GitHub-hosted runner는 무료지만, larger runner,
    # artifact/cache/storage 사용은 과금 또는 플랜 한도 영향을 받을 수 있다.
    # runner 종류나 산출물 업로드를 바꿀 때는 비용 리스크를 함께 리뷰한다.
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 검증 스크립트 실행
        run: bash ./scripts/validate-repo.sh
